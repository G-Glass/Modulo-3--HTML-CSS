<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitulo 21</title>
    <link rel="stylesheet" href="tabela4.css">
</head>
<body>
    <header>
        <h1>Mesclagem de células</h1>
    </header>
    <main>
        <section>
            <h2>Usando Mesclagem de células</h2>
            <article>
                <p>O uso de Mesclagem de células, use o elemento <span>Rowspan="2 ou 3,4" ou use colspan="2"</span> dentro do HTML.</p>
            </article>
        </section>
    </main>
    <table>
        <caption>Mesclagem de célula</caption>
        <tr>
            <td>A</td>
            <td colspan="2">B</td>
        </tr>
        <tr>
            <td>D</td>
            <td>E</td>
            <td rowspan="3">F</td>
        </tr>
        <tr>
            <td>H</td>
            <td>I</td>
        </tr>
        <tr>
            <td>K</td>
            <td>L</td>
        </tr>
    </table>
</body>
</html>
